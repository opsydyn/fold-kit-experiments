name: Archive field guide observations

on:
  push:
    branches: [main]
    paths: ['.github/workflows/field-guide-archive.yml']
  workflow_run:
    workflows:
      [
        'Web mutation advisory',
        'Zloz history mutation advisory',
        'Viz axis mutation advisory',
        'Astro client mutation advisory',
        'Astro Effect UI client mutation advisory',
        'Dataset Explorer cache mutation advisory',
        'Dash CSV mutation advisory',
        'Force eligibility mutation advisory',
        'Mermaid labels mutation advisory',
      ]
    types: [completed]

permissions:
  pull-requests: read
  actions: read
  contents: write

jobs:
  archive:
    if: github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    steps:
      # workflow_run resolves github.sha to trusted default-branch code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -B -m unittest discover -s tools/mutant-cafe/archive
      - name: Import completed advisories
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
          SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          cp tools/mutant-cafe/archive/{import_run.py,publish.sh} "$RUNNER_TEMP/"
          publish() {
            case "$1" in
              web-mutation-advisory.yml) export SOURCE_WORKSPACE=apps/web; artifact=web-mutation-outcomes ;;
              zloz-history-advisory.yml) export SOURCE_WORKSPACE=apps/zloz-demo; artifact=zloz-history-outcomes ;;
              viz-axis-advisory.yml) export SOURCE_WORKSPACE=packages/foldkit-viz; artifact=viz-axis-outcomes ;;
              astro-client-advisory.yml) export SOURCE_WORKSPACE=packages/astro-foldkit; artifact=astro-client-outcomes ;;
              astro-effect-ui-advisory.yml) export SOURCE_WORKSPACE=packages/astro-effect-ui; artifact=astro-effect-ui-client-outcomes ;;
              dataset-cache-advisory.yml) export SOURCE_WORKSPACE=packages/dataset-explorer; artifact=dataset-cache-outcomes ;;
              dash-csv-advisory.yml) export SOURCE_WORKSPACE=packages/foldkit-dash; artifact=dash-csv-outcomes ;;
              force-eligibility-advisory.yml) export SOURCE_WORKSPACE=packages/foldkit-zloz-force; artifact=force-eligibility-outcomes ;;
              mermaid-labels-advisory.yml) export SOURCE_WORKSPACE=packages/foldkit-zloz-mermaid; artifact=mermaid-labels-outcomes ;;
              *) return 1 ;;
            esac
            if [[ "$SOURCE_ATTEMPT" != 1 ]]; then artifact="$artifact-$SOURCE_ATTEMPT"; fi
            report="$RUNNER_TEMP/report-$SOURCE_RUN"
            gh run download "$SOURCE_RUN" --name "$artifact" --dir "$report"
            bash "$RUNNER_TEMP/publish.sh" "$RUNNER_TEMP/import_run.py" "$report/outcomes.json"
          }
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            case "$SOURCE_WORKFLOW" in
              'Web mutation advisory') publish web-mutation-advisory.yml ;;
              'Zloz history mutation advisory') publish zloz-history-advisory.yml ;;
              'Viz axis mutation advisory') publish viz-axis-advisory.yml ;;
              'Astro client mutation advisory') publish astro-client-advisory.yml ;;
              'Astro Effect UI client mutation advisory') publish astro-effect-ui-advisory.yml ;;
              'Dataset Explorer cache mutation advisory') publish dataset-cache-advisory.yml ;;
              'Dash CSV mutation advisory') publish dash-csv-advisory.yml ;;
              'Force eligibility mutation advisory') publish force-eligibility-advisory.yml ;;
              'Mermaid labels mutation advisory') publish mermaid-labels-advisory.yml ;;
              *) exit 1 ;;
            esac
            exit 0
          fi
          # Recover completed advisories from the PR that installed the listener.
          merged_head=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq 'map(select(.merged_at != null and .base.ref == "main")) | first | .head.sha // empty')
          [[ -n "$merged_head" ]] || exit 0
          for workflow in web-mutation-advisory.yml zloz-history-advisory.yml viz-axis-advisory.yml astro-effect-ui-advisory.yml dataset-cache-advisory.yml dash-csv-advisory.yml force-eligibility-advisory.yml mermaid-labels-advisory.yml; do
            observation=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs" \
              -f head_sha="$merged_head" -f event=pull_request -f status=success -f per_page=1 \
              --jq '.workflow_runs[] | [.id,.run_attempt,.run_started_at,.head_sha] | @tsv')
            [[ -n "$observation" ]] || continue
            read -r SOURCE_RUN SOURCE_ATTEMPT SOURCE_STARTED_AT SOURCE_SHA <<< "$observation"
            publish "$workflow"
          done
