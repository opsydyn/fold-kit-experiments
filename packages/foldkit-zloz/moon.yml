# Each task is the package script of the same name without its dependency
# builds, which moon runs first from `deps`. tools/ci-parity.test.ts checks this.
tasks:
  build:
    script: 'tsdown'
    outputs: ['dist/**/*']
  typecheck:
    script: 'tsc --noEmit'
  docs:
    script: 'typedoc'
    deps: ['build', 'foldkit-viz:build']
    # This API reference also documents the optional adapters and private CLI.
    inputs:
      - '**/*'
      - '/packages/foldkit-zloz*/src/**/*'
      - '/packages/foldkit-zloz*/tsconfig*.json'
      - '/packages/foldkit-zloz*/package.json'
    outputs: ['docs/**/*']
  test:
    script: "bun test ./test --path-ignore-patterns='**/package.test.ts'"
  integration:
    script: 'bun test ./test/package.test.ts'
    deps: ['build']
    # Rebuilds and packs packages itself, so it runs after the parallel checks,
    # one at a time, and its inputs cover everything it rebuilds.
    inputs: ['/packages/foldkit-zloz*/**/*', '/tools/pack-zloz.ts']
    options:
      mutex: 'rebuilds-packages'
