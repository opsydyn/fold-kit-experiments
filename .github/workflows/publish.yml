name: publish

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish'
        required: true
        type: choice
        options:
          - astro-foldkit
          - foldkit-viz
          # effect-three's four are released together: publish effect-three first, then
          # the others, which pin it as a peer at the same version.
          - effect-three
          - effect-three-rapier
          - effect-three-troika
          - effect-three-foldkit
      ref:
        description: 'Git ref to publish (tag, branch, or SHA). Leave empty to use the branch the workflow is dispatched from.'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Build and typecheck
        run: bun run --filter @opsydyn/${{ inputs.package }} build && bun run --filter @opsydyn/${{ inputs.package }} typecheck

      - name: Publish to npm
        if: ${{ env.NPM_TOKEN != '' && !startsWith(inputs.package, 'effect-three') }}
        working-directory: packages/${{ inputs.package }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      # Bun packs effect-three's packages so their workspace links become versions (npm
      # publish would ship `workspace:*`); npm publishes the tarball with provenance.
      - name: Pack and publish to npm (effect-three)
        if: ${{ env.NPM_TOKEN != '' && startsWith(inputs.package, 'effect-three') }}
        working-directory: packages/${{ inputs.package }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          bun run pack:check
          npm publish dist/pack/*.tgz --access public --provenance

      - name: Note missing NPM token
        if: ${{ env.NPM_TOKEN == '' }}
        run: |
          echo "::error::NPM_TOKEN secret is not configured. Add it as a repository secret to enable publishing."
          exit 1
