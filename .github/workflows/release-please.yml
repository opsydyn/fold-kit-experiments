name: release-please

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      prs_created: ${{ steps.release.outputs.prs_created }}
      prs: ${{ steps.release.outputs.prs }}
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN != '' && secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # ── @opsydyn/astro-foldkit ──────────────────────────────────────────────

      - name: Check out astro-foldkit release commit
        if: ${{ steps.release.outputs['packages/astro-foldkit--release_created'] == 'true' && env.NPM_TOKEN != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs['packages/astro-foldkit--sha'] }}

      - name: Set up Bun (astro-foldkit)
        if: ${{ steps.release.outputs['packages/astro-foldkit--release_created'] == 'true' && env.NPM_TOKEN != '' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Set up Node.js (astro-foldkit)
        if: ${{ steps.release.outputs['packages/astro-foldkit--release_created'] == 'true' && env.NPM_TOKEN != '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install workspace dependencies (astro-foldkit)
        if: ${{ steps.release.outputs['packages/astro-foldkit--release_created'] == 'true' && env.NPM_TOKEN != '' }}
        run: bun install --frozen-lockfile

      - name: Build package (astro-foldkit)
        if: ${{ steps.release.outputs['packages/astro-foldkit--release_created'] == 'true' && env.NPM_TOKEN != '' }}
        run: bun run --filter @opsydyn/astro-foldkit build

      - name: Typecheck package (astro-foldkit)
        if: ${{ steps.release.outputs['packages/astro-foldkit--release_created'] == 'true' && env.NPM_TOKEN != '' }}
        run: bun run --filter @opsydyn/astro-foldkit typecheck

      - name: Publish @opsydyn/astro-foldkit to npm
        if: ${{ steps.release.outputs['packages/astro-foldkit--release_created'] == 'true' && env.NPM_TOKEN != '' }}
        working-directory: packages/astro-foldkit
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      - name: Note missing NPM token (astro-foldkit)
        if: ${{ steps.release.outputs['packages/astro-foldkit--release_created'] == 'true' && env.NPM_TOKEN == '' }}
        run: |
          echo "astro-foldkit release was tagged, but npm publish was skipped because NPM_TOKEN is not configured."
          echo "Add an NPM_TOKEN repository secret to enable automated publication."

      # ── @opsydyn/foldkit-viz ────────────────────────────────────────────────

      - name: Check out foldkit-viz release commit
        if: ${{ steps.release.outputs['packages/foldkit-viz--release_created'] == 'true' && env.NPM_TOKEN != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs['packages/foldkit-viz--sha'] }}

      - name: Set up Bun (foldkit-viz)
        if: ${{ steps.release.outputs['packages/foldkit-viz--release_created'] == 'true' && env.NPM_TOKEN != '' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Set up Node.js (foldkit-viz)
        if: ${{ steps.release.outputs['packages/foldkit-viz--release_created'] == 'true' && env.NPM_TOKEN != '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install workspace dependencies (foldkit-viz)
        if: ${{ steps.release.outputs['packages/foldkit-viz--release_created'] == 'true' && env.NPM_TOKEN != '' }}
        run: bun install --frozen-lockfile

      - name: Build package (foldkit-viz)
        if: ${{ steps.release.outputs['packages/foldkit-viz--release_created'] == 'true' && env.NPM_TOKEN != '' }}
        run: bun run --filter @opsydyn/foldkit-viz build

      - name: Typecheck package (foldkit-viz)
        if: ${{ steps.release.outputs['packages/foldkit-viz--release_created'] == 'true' && env.NPM_TOKEN != '' }}
        run: bun run --filter @opsydyn/foldkit-viz typecheck

      - name: Publish @opsydyn/foldkit-viz to npm
        if: ${{ steps.release.outputs['packages/foldkit-viz--release_created'] == 'true' && env.NPM_TOKEN != '' }}
        working-directory: packages/foldkit-viz
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      - name: Note missing NPM token (foldkit-viz)
        if: ${{ steps.release.outputs['packages/foldkit-viz--release_created'] == 'true' && env.NPM_TOKEN == '' }}
        run: |
          echo "foldkit-viz release was tagged, but npm publish was skipped because NPM_TOKEN is not configured."
          echo "Add an NPM_TOKEN repository secret to enable automated publication."

  normalize-changelogs:
    needs: release
    if: ${{ always() && !cancelled() && needs.release.outputs.prs_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out trusted formatter code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install trusted formatter
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Normalize generated changelogs
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN != '' && secrets.RELEASE_PLEASE_TOKEN || github.token }}
          RELEASE_PLEASE_PRS: ${{ needs.release.outputs.prs }}
        run: bash .github/scripts/format-release-changelogs.sh
