[project]
name = "foldkit-viz"
version = "0.1.0"
description = "Charts from @opsydyn/foldkit-viz plot specs in Jupyter, as an anywidget."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["anywidget>=0.9.13", "jsonschema>=4.18"]

[dependency-groups]
dev = ["pytest>=8", "jupyterlab>=4.2", "nbclient>=0.10", "ipykernel>=6.29"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foldkit_viz"]
artifacts = ["src/foldkit_viz/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
