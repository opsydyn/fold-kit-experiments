name: zloz-release-train

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Full release SHA. Dispatch from its matching core release tag.'
        required: true
        type: string
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
    secrets:
      NPM_TOKEN:
        required: true

permissions:
  contents: read
  actions: read
  id-token: write

# Manual recovery and automatic releases use the same family lock. Never cancel an upload.
concurrency:
  group: zloz-npm-release-train
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Validate source, family tags and successful source CI
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/zloz-release-train.mjs preflight
      - name: Install frozen workspace dependencies
        run: bun install --frozen-lockfile
      - name: Qualify all candidate archives before publishing
        run: |
          bun tools/check-package-identity.ts
          bun run --filter @opsydyn/foldkit-zloz pack:check
          bun run --filter @opsydyn/foldkit-zloz-elk pack:check
          bun run --filter @opsydyn/foldkit-zloz-force pack:check
          bun run --filter @opsydyn/foldkit-zloz-mermaid pack:check
      - name: Publish and verify in dependency order
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node .github/scripts/zloz-release-train.mjs
      - name: Retain candidates and verification receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zloz-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/zloz-release/
            packages/foldkit-zloz/dist/pack/*.tgz
            packages/foldkit-zloz-elk/dist/pack/*.tgz
            packages/foldkit-zloz-force/dist/pack/*.tgz
            packages/foldkit-zloz-mermaid/dist/pack/*.tgz
          if-no-files-found: ignore
