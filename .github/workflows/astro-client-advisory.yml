name: Astro client mutation advisory

on:
  pull_request:
    paths:
      - 'packages/astro-foldkit/src/client-helpers.ts'
      - 'packages/astro-foldkit/test/unit/client-helpers.test.ts'
      - 'packages/astro-foldkit/vitest.config.ts'
      - 'packages/astro-foldkit/package.json'
      - '.github/workflows/astro-client-advisory.yml'
      - 'tools/mutant-cafe/**'

permissions:
  contents: read

concurrency:
  group: astro-client-mutation-advisory-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  astro-client:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - run: bun install --frozen-lockfile

      - name: Install the locked mutation tool
        run: npm ci --prefix tools/mutant-cafe

      - name: Replay the four client-helper mutations
        id: mutation
        working-directory: packages/astro-foldkit
        run: |
          # Measure the client-helper suite in isolation from the package's Bun tests.
          package_dir=$PWD
          suite="$RUNNER_TEMP/client-helper-suite"
          mkdir -p "$suite/src" "$suite/test/unit"
          cp package.json tsconfig.json vitest.config.ts "$suite/"
          cp src/client-helpers.ts "$suite/src/"
          cp test/unit/client-helpers.test.ts "$suite/test/unit/"
          ln -s "$package_dir/node_modules" "$suite/node_modules"
          cd "$suite"
          "$package_dir/../../tools/mutant-cafe/node_modules/.bin/mutant-cafe" --advisory --format github \
            --file src/client-helpers.ts --jobs 1 --max-mutants 4 --baseline-timeout 300 \
            --output "$RUNNER_TEMP/astro-mutants"

          jq -e '([.results[].mutant.id] | sort) == [
            "022078975fd4f41e664ef83d", "1e7bd4d1dce1b5a06dc9fa6d",
            "3ff6a373228837ef4ee3f8bf", "dc15c4cd43161e1ed9265b57"
          ]' "$RUNNER_TEMP/astro-mutants/outcomes.json"

      - name: Upload mutation outcomes
        if: ${{ !cancelled() && steps.mutation.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.run_attempt == 1 && 'astro-client-outcomes' || format('astro-client-outcomes-{0}', github.run_attempt) }}
          path: ${{ runner.temp }}/astro-mutants/outcomes.json
          if-no-files-found: error
