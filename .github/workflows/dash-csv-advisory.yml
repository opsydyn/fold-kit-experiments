name: Dash CSV mutation advisory

on:
  pull_request:
    paths:
      - 'packages/foldkit-dash/src/csv.ts'
      - 'packages/foldkit-dash/src/rows.ts'
      - 'packages/foldkit-dash/test/csv.test.ts'
      - 'packages/foldkit-dash/vitest.config.ts'
      - 'packages/foldkit-dash/package.json'
      - '.github/workflows/dash-csv-advisory.yml'
      - 'tools/mutant-cafe/**'

permissions:
  contents: read

concurrency:
  group: dash-csv-mutation-advisory-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dash-csv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - run: bun install --frozen-lockfile

      - name: Install the locked mutation tool
        run: npm ci --prefix tools/mutant-cafe

      - name: Replay typed cell replacements against the CSV suite
        run: bash tools/mutant-cafe/dash-csv.sh "$RUNNER_TEMP/dash-csv"

      - name: Upload replay and test evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.run_attempt == 1 && 'dash-csv-outcomes' || format('dash-csv-outcomes-{0}', github.run_attempt) }}
          path: ${{ runner.temp }}/dash-csv/
          if-no-files-found: error
