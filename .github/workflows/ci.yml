name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

# A pull request's runs supersede each other: only the newest push to a branch
# is worth checking, so its group is the ref and the older run is cancelled.
#
# A push to main must not work that way. The Zloz release train publishes only
# from a commit whose own push run concluded `success`
# (.github/scripts/zloz-release-train.mjs, `waitForCI`), and under one group per
# ref every main run was cancelled by the next merge. That is what blocked
# foldkit-zloz 0.8.0 and 0.9.0: the train read `cancelled`, not a test failure.
# Giving each pushed commit its own group lets every one of them reach a
# conclusion the train can read, and lets a release commit's run be re-run
# later without a merge killing it. Standard runners are free on this public
# repository, so the cost is concurrent runners, not minutes.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Each job runs its root `ci:<job>` script, a moon run that the git hooks and
# local runs use too (tools/ci-parity.test.ts keeps them in step). CI starts
# with an empty moon cache, so it runs every task. A pull request's shallow
# checkout has no main branch, so moon compares against HEAD.
env:
  MOON_BASE: HEAD

# Each job carries `timeout-minutes` because the default is six hours, and a
# step that hangs rather than fails holds the branch for all of it. On a green
# run `check` takes about 20 minutes and `foldkit-zloz` about 18, the browser
# qualification being serial across three engines; the others finish in a
# minute or two. Each budget is roughly double what its job needs, so it ends a
# hang without failing a slow runner.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # foldkit-viz-py's tests run pytest in the environment its uv.lock pins.
      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium for Teams
        working-directory: apps/zloz-team
        run: bunx --no-install playwright install --with-deps --only-shell chromium

      - name: Lint, typecheck, test, build, API reports, size budgets, then integration tests
        run: bun run ci:check

  p0:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Run tests for release-blocking user impact
        run: bun run ci:p0

  astro-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Build a site with each supported Astro major
        run: bun run ci:astro-compat

  effect-three:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium (headless shell)
        working-directory: packages/effect-three-foldkit
        run: bunx playwright install --with-deps --only-shell chromium

      - name: Package checks, browser and visual tests
        run: bun run ci:effect-three

      - name: Upload golden diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: effect-three-golden-diffs
          path: packages/effect-three-foldkit/e2e/goldens/__diff__/
          if-no-files-found: ignore

  foldkit-zloz:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Install browser
        working-directory: apps/web
        run: bunx --no-install playwright install --with-deps chromium firefox webkit
      - name: Browser editing journey
        run: bun run ci:foldkit-zloz
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foldkit-zloz-browser
          path: |
            apps/web/test-results/
            apps/zloz-demo/evidence/v3-completion/browser-artifacts/
            apps/zloz-demo/evidence/v3-completion/playwright-results.json
          if-no-files-found: ignore
