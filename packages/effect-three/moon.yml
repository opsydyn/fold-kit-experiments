# Each task is the package script of the same name without its dependency
# builds, which moon runs first from `deps`. tools/ci-parity.test.ts checks this.
# Files outside this folder its tasks read; see .moon/tasks/reads-*.yml.
tags: ['reads-workspace-manifests']

tasks:
  build:
    script: 'tsc -b && bun build ./src/index.ts ./src/kernel/index.ts ./src/webgl/index.ts ./src/webgpu/index.ts --root ./src --outdir ./dist --target browser --packages external --splitting --sourcemap=linked'
    outputs: ['dist/**/*']
  typecheck:
    script: 'tsc -b && tsc -p tsconfig.test.json'
    deps: ['build']
  test:
    script: 'bun test --pass-with-no-tests ./src ./test --coverage --coverage-reporter=lcov --coverage-dir=coverage && bun scripts/check-coverage.ts coverage/lcov.info'
  api-check:
    script: 'api-extractor run'
    deps: ['build']
  lint:
    script: 'bun run lint && bun run check:boundaries && bun run check:single-effect'
  pack-check:
    script: 'publint && rm -rf dist/pack && bun pm pack --destination dist/pack && attw dist/pack/*.tgz --profile esm-only'
    deps: ['build']
    options:
      cache: false
