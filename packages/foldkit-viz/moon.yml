# Each task is the package script of the same name without its dependency
# builds, which moon runs first from `deps`. tools/ci-parity.test.ts checks this.
tasks:
  build:
    script: 'tsdown'
    outputs: ['dist/**/*']
  typecheck:
    script: 'tsc --noEmit'
    # effect-three/space3d imports effect-three's types, which come from its build.
    deps: ['^:build']
  docs:
    script: 'typedoc'
    deps: ['^:build']
    outputs: ['docs/**/*']
  test:
    script: "bun test --path-ignore-patterns='**/package-import-smoke.test.ts'"
  api-check:
    script: 'bun ../../tools/api-surface.ts --check'
    deps: ['build']
  size-check:
    script: 'bun ../../tools/bundle-budget.ts'
    deps: ['build']
  schema-check:
    script: 'bun ../../tools/plot-schema.ts --check'
    # The schema is generated from the spec types by a tool outside the package.
    inputs: ['src/plot/types.ts', 'schema/**/*', 'tsconfig.json', '/tools/plot-schema.ts']
  integration:
    script: 'bun test ./test/package-import-smoke.test.ts'
    deps: ['build']
    # Rebuilds and packs packages itself, so it runs after the parallel checks,
    # one at a time, and its inputs cover everything it rebuilds.
    inputs: ['/packages/foldkit-viz/**/*']
    options:
      mutex: 'rebuilds-packages'
