name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Oxlint and Oxfmt
        run: bun run check

      - name: Typecheck workspace
        run: bun typecheck

      - name: Test workspace
        run: bun run test

      - name: Build workspace
        run: bun run build

  effect-three:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Build and check packages (publint, attw)
        run: |
          bun run --filter @opsydyn/effect-three pack:check
          bun run --filter @opsydyn/effect-three-foldkit pack:check
          bun run --filter @opsydyn/effect-three-rapier pack:check
          bun run --filter @opsydyn/effect-three-troika pack:check

      - name: Public API reports are up to date
        run: |
          bun run --filter @opsydyn/effect-three api:check
          bun run --filter @opsydyn/effect-three-foldkit api:check
          bun run --filter @opsydyn/effect-three-rapier api:check
          bun run --filter @opsydyn/effect-three-troika api:check

      - name: Install Playwright Chromium (headless shell)
        working-directory: packages/effect-three-foldkit
        run: bunx playwright install --with-deps --only-shell chromium

      - name: Browser and visual tests
        run: bun run --filter @opsydyn/effect-three-foldkit test:e2e

      - name: Upload golden diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: effect-three-golden-diffs
          path: packages/effect-three-foldkit/e2e/goldens/__diff__/
          if-no-files-found: ignore

  foldkit-zloz:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Check package tarballs and clean npm consumer
        run: bun run --filter @opsydyn/foldkit-zloz test
      - name: Check real ELK layout
        run: bun run --filter @opsydyn/foldkit-zloz-elk test
      - name: Check force adapter and packed consumer
        run: bun run --filter @opsydyn/foldkit-zloz-force test
      - name: Check Mermaid exporter and packed consumer
        run: bun run --filter @opsydyn/foldkit-zloz-mermaid test
      - name: Install browser
        working-directory: apps/web
        run: bunx --no-install playwright install --with-deps chromium
      - name: Browser editing journey
        run: bun run --filter @opsydyn/web test:e2e e2e/zloz.spec.ts
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foldkit-zloz-browser
          path: apps/web/test-results/
          if-no-files-found: ignore
