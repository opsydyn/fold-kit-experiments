name: Web mutation advisory

on:
  pull_request:
    paths:
      - 'apps/web/src/**/*.ts'
      - '.github/workflows/web-mutation-advisory.yml'
      - 'tools/web-mutation-advisory.sh'

permissions:
  contents: read

concurrency:
  group: web-mutation-advisory-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  web-mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - run: bun install --frozen-lockfile

      - name: Build web dependencies and generate Astro types
        run: bun run --filter @opsydyn/web typecheck

      - name: Run up to 20 mutants on changed web source
        id: mutation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash tools/web-mutation-advisory.sh "$BASE_SHA" "$RUNNER_TEMP"

      - name: Upload mutation outcomes
        if: ${{ !cancelled() && steps.mutation.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-mutation-outcomes
          path: ${{ runner.temp }}/web-mutants/outcomes.json
          if-no-files-found: error
