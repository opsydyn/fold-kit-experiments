<svg xmlns="http://www.w3.org/2000/svg" width="1088" height="668" viewBox="-4 -4 1088 668" role="img" aria-labelledby="zloz-export-title zloz-export-description" font-family="sans-serif"><title id="zloz-export-title">Working model</title><desc id="zloz-export-description">Canonical Foldkit Zloz model; editor controls and host overlays are not captured.</desc><defs><clipPath id="zloz-export-clip" clipPathUnits="userSpaceOnUse"><rect x="-4" y="-4" width="1088" height="668"/></clipPath><marker id="zloz-export-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#a6b7ce"/></marker></defs><g clip-path="url(#zloz-export-clip)"><rect x="-4" y="-4" width="1088" height="668" fill="#111827"/><g data-zloz-export-node="workshop-lane"><g transform="translate(20,20)"><path d="M0,0 H1040 V620 H0 Z" fill="rgb(148 163 184 / 0.1)" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/><text x="12" y="24" text-anchor="start" font-size="14" font-weight="600" fill="#edf2fa" stroke="none" stroke-width="1" opacity="1"><tspan x="12" dy="0">Payment discovery</tspan></text><text x="12" y="41.5" text-anchor="start" font-size="14" font-weight="400" fill="#edf2fa" stroke="none" stroke-width="1" opacity="1"><tspan x="12" dy="0">Workshop lane</tspan></text><text x="12" y="59" text-anchor="start" font-size="14" font-weight="400" fill="#edf2fa" stroke="none" stroke-width="1" opacity="1"><tspan x="12" dy="0">Organization, not a runtime boundary</tspan></text></g></g><g data-zloz-export-edge="provider-handles"><path d="M280,225 L400,225" fill="none" stroke="#a6b7ce" stroke-width="3" marker-end="url(#zloz-export-arrow)"/><text x="340" y="217" text-anchor="middle" font-size="14" font-weight="400" fill="#edf2fa" stroke="none" stroke-width="1" opacity="1"><tspan x="340" dy="0">Handled by</tspan></text></g><g data-zloz-export-edge="provider-emits"><path d="M610,225 L730,225" fill="none" stroke="#a6b7ce" stroke-width="3" marker-end="url(#zloz-export-arrow)"/><text x="670" y="217" text-anchor="middle" font-size="14" font-weight="400" fill="#edf2fa" stroke="none" stroke-width="1" opacity="1"><tspan x="670" dy="0">Emits</tspan></text></g><g data-zloz-export-node="request"><g transform="translate(70,150)"><path d="M0,0 H210 V150 H0 Z" fill="#93c5fd" stroke="#7889a3" stroke-width="1.5"/><text x="12" y="24" text-anchor="start" font-size="14" font-weight="600" fill="#edf2fa" stroke="none" stroke-width="1" opacity="1"><tspan x="12" dy="0">Request payment</tspan></text><text x="12" y="41.5" text-anchor="start" font-size="14" font-weight="400" fill="#edf2fa" stroke="none" stroke-width="1" opacity="1"><tspan x="12" dy="0">[event-storming: command]</tspan></text></g><g data-zloz-export-port="in"><circle cx="70" cy="225" r="4" fill="#7bd8c9" stroke="#1a2638" stroke-width="1" opacity="1"/><text x="61" y="218" text-anchor="end" font-size="14" font-weight="400" fill="#edf2fa" stroke="none" stroke-width="1" opacity="1"><tspan x="61" dy="0">in</tspan></text></g><g data-zloz-export-port="out"><circle cx="280" cy="225" r="4" fill="#98beff" stroke="#1a2638" stroke-width="1" opacity="1"/><text x="289" y="218" text-anchor="start" font-size="14" font-weight="400" fill="#edf2fa" stroke="none" stroke-width="1" opacity="1"><tspan x="289" dy="0">out</tspan></text></g></g><g data-zloz-export-node="provider"><g transform="translate(400,150)"><path d="M0,0 H210 V150 H0 Z" fill="#202b3e" stroke="#67e8f9" stroke-width="2" stroke-dasharray="6 4"/><text x="12" y="24" text-anchor="start" font-size="14" font-weight="600" fill="#edf2fa" stroke="none" stroke-width="1" opacity="1"><tspan x="12" dy="0">Payment provider</tspan></text><text x="12" y="41.5" text-anchor="start" font-size="14" font-weight="400" fill="#edf2fa" stroke="none" stroke-width="1" opacity="1"><tspan x="12" dy="0">External system</tspan></text></g><g data-zloz-export-port="in"><circle cx="400" cy="225" r="4" fill="#7bd8c9" stroke="#1a2638" stroke-width="1" opacity="1"/><text x="391" y="218" text-anchor="end" font-size="14" font-weight="400" fill="#edf2fa" stroke="none" stroke-width="1" opacity="1"><tspan x="391" dy="0">in</tspan></text></g><g data-zloz-export-port="out"><circle cx="610" cy="225" r="4" fill="#98beff" stroke="#1a2638" stroke-width="1" opacity="1"/><text x="619" y="218" text-anchor="start" font-size="14" font-weight="400" fill="#edf2fa" stroke="none" stroke-width="1" opacity="1"><tspan x="619" dy="0">out</tspan></text></g></g><g data-zloz-export-node="accepted"><g transform="translate(730,150)"><path d="M0,0 H210 V150 H0 Z" fill="#fdba74" stroke="#7889a3" stroke-width="1.5"/><text x="12" y="24" text-anchor="start" font-size="14" font-weight="600" fill="#edf2fa" stroke="none" stroke-width="1" opacity="1"><tspan x="12" dy="0">Payment accepted</tspan></text><text x="12" y="41.5" text-anchor="start" font-size="14" font-weight="400" fill="#edf2fa" stroke="none" stroke-width="1" opacity="1"><tspan x="12" dy="0">[event-storming: domain-event]</tspan></text></g><g data-zloz-export-port="in"><circle cx="730" cy="225" r="4" fill="#7bd8c9" stroke="#1a2638" stroke-width="1" opacity="1"/><text x="721" y="218" text-anchor="end" font-size="14" font-weight="400" fill="#edf2fa" stroke="none" stroke-width="1" opacity="1"><tspan x="721" dy="0">in</tspan></text></g><g data-zloz-export-port="out"><circle cx="940" cy="225" r="4" fill="#98beff" stroke="#1a2638" stroke-width="1" opacity="1"/><text x="949" y="218" text-anchor="start" font-size="14" font-weight="400" fill="#edf2fa" stroke="none" stroke-width="1" opacity="1"><tspan x="949" dy="0">out</tspan></text></g></g><g data-zloz-export-node="retry-question"><g transform="translate(140,390)"><path d="M0,0 H330 V170 H0 Z" fill="#202b3e" stroke="#fda4af" stroke-width="2"/><text x="12" y="24" text-anchor="start" font-size="14" font-weight="600" fill="#edf2fa" stroke="none" stroke-width="1" opacity="1"><tspan x="12" dy="0">Who owns retries?</tspan></text><text x="12" y="41.5" text-anchor="start" font-size="14" font-weight="400" fill="#edf2fa" stroke="none" stroke-width="1" opacity="1"><tspan x="12" dy="0">Hotspot</tspan></text><text x="12" y="59" text-anchor="start" font-size="14" font-weight="400" fill="#fda4af" stroke="none" stroke-width="1" opacity="1"><tspan x="12" dy="0">Open question</tspan></text><text x="12" y="76.5" text-anchor="start" font-size="14" font-weight="400" fill="#edf2fa" stroke="none" stroke-width="1" opacity="1"><tspan x="12" dy="0">Clarify the handoff after a provider timeout.</tspan></text></g></g><g data-zloz-export-node="timeout-agreement"><g transform="translate(590,390)"><path d="M0,0 H330 V170 H0 Z" fill="#202b3e" stroke="#6ee7b7" stroke-width="2"/><text x="12" y="24" text-anchor="start" font-size="14" font-weight="600" fill="#edf2fa" stroke="none" stroke-width="1" opacity="1"><tspan x="12" dy="0">Timeout contract agreed</tspan></text><text x="12" y="41.5" text-anchor="start" font-size="14" font-weight="400" fill="#edf2fa" stroke="none" stroke-width="1" opacity="1"><tspan x="12" dy="0">Hotspot</tspan></text><text x="12" y="59" text-anchor="start" font-size="14" font-weight="400" fill="#6ee7b7" stroke="none" stroke-width="1" opacity="1"><tspan x="12" dy="0">Resolved</tspan></text><text x="12" y="76.5" text-anchor="start" font-size="14" font-weight="400" fill="#edf2fa" stroke="none" stroke-width="1" opacity="1"><tspan x="12" dy="0">Facilitator-approved decision; unlock to reopen.</tspan></text></g></g></g></svg>