<svg xmlns="http://www.w3.org/2000/svg" width="1190" height="1026" viewBox="0 0 1190 1026" role="img" aria-labelledby="zloz-export-title zloz-export-description" font-family="sans-serif"><title id="zloz-export-title">Working model</title><desc id="zloz-export-description">Canonical Foldkit Zloz model; editor controls and host overlays are not captured.</desc><defs><clipPath id="zloz-export-clip" clipPathUnits="userSpaceOnUse"><rect x="0" y="0" width="1190" height="1026"/></clipPath><marker id="zloz-export-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#a6b7ce"/></marker></defs><g clip-path="url(#zloz-export-clip)"><g data-zloz-export-edge="draft-review"><path d="M220,140 L360,220" fill="none" stroke="#a6b7ce" stroke-width="3" marker-end="url(#zloz-export-arrow)"/></g><g data-zloz-export-node="source"><g transform="translate(40,70)"><path d="M0,0 H180 V140 H0 Z" fill="#202b3e" stroke="#7889a3" stroke-width="1.5"/><text x="12" y="24" text-anchor="start" font-size="14" font-weight="600" fill="#edf2fa" stroke="none" stroke-width="1" opacity="1"><tspan x="12" dy="0">Draft</tspan></text></g><g data-zloz-export-port="out"><circle cx="220" cy="140" r="4" fill="#98beff" stroke="#1a2638" stroke-width="1" opacity="1"/><text x="229" y="133" text-anchor="start" font-size="14" font-weight="400" fill="#edf2fa" stroke="none" stroke-width="1" opacity="1"><tspan x="229" dy="0">out</tspan></text></g></g><g data-zloz-export-node="review"><g transform="translate(360,150)"><path d="M0,0 H180 V140 H0 Z" fill="#202b3e" stroke="#7889a3" stroke-width="1.5"/><text x="12" y="24" text-anchor="start" font-size="14" font-weight="600" fill="#edf2fa" stroke="none" stroke-width="1" opacity="1"><tspan x="12" dy="0">Review</tspan></text></g><g data-zloz-export-port="in"><circle cx="360" cy="220" r="4" fill="#7bd8c9" stroke="#1a2638" stroke-width="1" opacity="1"/><text x="351" y="213" text-anchor="end" font-size="14" font-weight="400" fill="#edf2fa" stroke="none" stroke-width="1" opacity="1"><tspan x="351" dy="0">in</tspan></text></g><g data-zloz-export-port="out"><circle cx="540" cy="220" r="4" fill="#98beff" stroke="#1a2638" stroke-width="1" opacity="1"/><text x="549" y="213" text-anchor="start" font-size="14" font-weight="400" fill="#edf2fa" stroke="none" stroke-width="1" opacity="1"><tspan x="549" dy="0">out</tspan></text></g></g><g data-zloz-export-node="publish"><g transform="translate(640,70)"><path d="M0,0 H180 V140 H0 Z" fill="#202b3e" stroke="#7889a3" stroke-width="1.5"/><text x="12" y="24" text-anchor="start" font-size="14" font-weight="600" fill="#edf2fa" stroke="none" stroke-width="1" opacity="1"><tspan x="12" dy="0">Publish</tspan></text></g><g data-zloz-export-port="in"><circle cx="640" cy="140" r="4" fill="#7bd8c9" stroke="#1a2638" stroke-width="1" opacity="1"/><text x="631" y="133" text-anchor="end" font-size="14" font-weight="400" fill="#edf2fa" stroke="none" stroke-width="1" opacity="1"><tspan x="631" dy="0">in</tspan></text></g></g></g></svg>