name: Deploy Zloz workbench to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'apps/flow-sample/**'
      - 'infra/zloz/**'
      - 'packages/foldkit-flow*/**'
      - 'packages/astro-foldkit/**'
      - 'packages/foldkit-viz/**'
      - 'docs/assets/zloz/final/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/deploy-zloz.yml'
  workflow_dispatch:

permissions:
  contents: read

# Existing account/zone hosting credentials; state and Worker ownership are separate.
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.TECH_RADAR_CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TECH_RADAR_CLOUDFLARE_ACCOUNT_ID }}

concurrency:
  group: deploy-zloz-prod
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify hosting credentials
        working-directory: infra/zloz
        run: bunx alchemy provider check-env --no-input
      - name: Deploy the workbench
        working-directory: infra/zloz
        run: bun run deploy --stage prod --yes --no-input
      - name: Record destination
        run: echo 'Zloz workbench — https://zloz.opsydyn.xyz/' >> "$GITHUB_STEP_SUMMARY"
