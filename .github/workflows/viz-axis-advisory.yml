name: Viz axis mutation advisory

on:
  pull_request:
    paths:
      - 'packages/foldkit-viz/src/chart/**'
      - 'packages/foldkit-viz/src/math/**'
      - 'packages/foldkit-viz/test/cartesian-scales.test.ts'
      - 'packages/foldkit-viz/test/render-chart.ts'
      - 'packages/foldkit-viz/vitest.config.ts'
      - 'packages/foldkit-viz/package.json'
      - '.github/workflows/viz-axis-advisory.yml'
      - 'tools/mutant-cafe/**'

permissions:
  contents: read

concurrency:
  group: viz-axis-mutation-advisory-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  viz-axis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - run: bun install --frozen-lockfile

      - name: Install the locked mutation tool
        run: npm ci --prefix tools/mutant-cafe

      - name: Replay linearLabels against the Cartesian scale suite
        id: mutation
        working-directory: packages/foldkit-viz
        run: |
          # This advisory measures the Cartesian scale suite. The workspace also has
          # Bun tests, which the full CI job exercises independently.
          package_dir=$PWD
          suite="$RUNNER_TEMP/cartesian-suite"
          mkdir -p "$suite/test"
          cp -R src package.json tsconfig.json vitest.config.ts "$suite/"
          cp test/{cartesian-scales.test,render-chart}.ts "$suite/test/"
          ln -s "$package_dir/node_modules" "$suite/node_modules"
          cd "$suite"
          # Select the formatter body by its declaration so unrelated line moves are harmless.
          awk '/^function linearLabels\(/ {
            if (getline <= 0) exit 1
            printf "--- a/src/chart/layout.ts\n+++ b/src/chart/layout.ts\n@@ -%d,0 +%d @@\n+%s\n", NR-1, NR, $0
            found=1
          } END { if (!found) exit 1 }' src/chart/layout.ts > "$RUNNER_TEMP/axis.diff"
          "$package_dir/../../tools/mutant-cafe/node_modules/.bin/mutant-cafe" --advisory --format github \
            --file src/chart/layout.ts --in-diff "$RUNNER_TEMP/axis.diff" --jobs 1 --max-mutants 3 --baseline-timeout 300 \
            --output "$RUNNER_TEMP/viz-mutants"

          jq -e '([.results[].mutant.id] | sort) == [
            "47434606e330580e5ef0a603", "cec254c4a128d942fd973c7a", "fcf999e3071a382b77893676"
          ]' "$RUNNER_TEMP/viz-mutants/outcomes.json"

      - name: Upload mutation outcomes
        if: ${{ !cancelled() && steps.mutation.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.run_attempt == 1 && 'viz-axis-outcomes' || format('viz-axis-outcomes-{0}', github.run_attempt) }}
          path: ${{ runner.temp }}/viz-mutants/outcomes.json
          if-no-files-found: error
