# Each task is the package script of the same name without its dependency
# builds, which moon runs first from `deps`. tools/ci-parity.test.ts checks this.
tasks:
  build:
    script: 'astro build'
    deps: ['typecheck', '^:build']
    outputs: ['dist/**/*']
  typecheck:
    script: 'astro check'
    deps: ['^:build']
  test:
    script: 'vitest run'
    deps: ['^:build']
  e2e-zloz:
    script: 'playwright test e2e/zloz.spec.ts'
    deps: ['^:build']
    options:
      cache: false
