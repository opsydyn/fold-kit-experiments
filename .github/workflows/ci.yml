name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Each job runs its root `ci:<job>` script, a moon run that the git hooks and
# local runs use too (tools/ci-parity.test.ts keeps them in step). CI starts
# with an empty moon cache, so it runs every task. A pull request's shallow
# checkout has no main branch, so moon compares against HEAD.
env:
  MOON_BASE: HEAD

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Lint, typecheck, test, build, API reports, size budgets, then integration tests
        run: bun run ci:check

  astro-compat:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Build a site with each supported Astro major
        run: bun run ci:astro-compat

  effect-three:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium (headless shell)
        working-directory: packages/effect-three-foldkit
        run: bunx playwright install --with-deps --only-shell chromium

      - name: Package checks, browser and visual tests
        run: bun run ci:effect-three

      - name: Upload golden diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: effect-three-golden-diffs
          path: packages/effect-three-foldkit/e2e/goldens/__diff__/
          if-no-files-found: ignore

  foldkit-zloz:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Install browser
        working-directory: apps/web
        run: bunx --no-install playwright install --with-deps chromium
      - name: Browser editing journey
        run: bun run ci:foldkit-zloz
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foldkit-zloz-browser
          path: apps/web/test-results/
          if-no-files-found: ignore
